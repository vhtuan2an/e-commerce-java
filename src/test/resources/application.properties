spring.security.user.name=test-admin
spring.security.user.password=test-admin-password
project.image=images/

spring.app.jwtSecret=test-jwt-secret-123456789012345678901234567890
spring.app.jwtExpirationMs=86400000
spring.app.jwtCookieName=test-cookie

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

momo.partner-code=test-partner
momo.access-key=test-access
momo.secret-key=test-secret
momo.endpoint-create=https://example.com/create
momo.redirect-url=http://localhost:8080/payment/return
momo.ipn-url=http://localhost:8080/api/payments/momo/ipn

logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
